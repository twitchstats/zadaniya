<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Донат-меню</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Onest:wght@500;600;700;800&family=Manrope:wght@600;800&family=Russo+One&family=Oswald:wght@500;700&family=Rubik+Mono+One&family=Press+Start+2P&family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root{--sh:0 1px 3px #000;--a:#9146ff;--b:#ff4fd8;--c:#ffd84a;--bgc:rgba(15,10,30,.74);--f1:Unbounded;--f2:Onest;--fs:26px}
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,"Segoe UI",sans-serif;color:#fff;background:#0e0b17}
/* ===== виджет ===== */
.w{padding:14px;font-size:var(--fs);line-height:1.2}
.w h1{margin:0 0 .35em;font:800 1.15em var(--f1),sans-serif;letter-spacing:.04em;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px var(--a)) drop-shadow(0 2px 4px rgba(0,0,0,.7))}
.w h2{margin:.6em 0 .3em;font:800 .55em var(--f2),sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--c);text-shadow:var(--sh),0 0 10px var(--c)}
.list{display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));gap:.35em .8em}
.card{margin:0;display:flex;gap:.6em;align-items:center;padding:.4em .6em;min-width:0;border-radius:.7em;background:var(--bgc);border:1px solid rgba(255,255,255,.14);border-left:5px solid var(--b);box-shadow:0 4px 18px rgba(0,0,0,.45);animation:in .5s both}
.card.act{border-color:var(--c);animation:in .5s both,glow 1.6s ease-in-out infinite}
.amt{font:800 .85em var(--f1),sans-serif;box-shadow:0 0 14px var(--a);padding:.25em .6em;border-radius:.5em;background:linear-gradient(135deg,var(--a),var(--b));white-space:nowrap;color:var(--ac,#fff);text-shadow:var(--ash,var(--sh))}
.txt{font:800 1em var(--f2),sans-serif;min-width:0;overflow-wrap:anywhere;text-shadow:var(--sh)}
.pop{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;padding:.8em 1.2em;border-radius:1em;background:var(--bgc);border:2px solid var(--b);box-shadow:0 0 50px var(--a),inset 0 0 30px rgba(255,255,255,.05);animation:pop 6s both;z-index:9;max-width:90%}
.pop .amt{font-size:1.5em;display:inline-block;margin-bottom:.3em}
.pop .txt{font-size:1.5em}
.w.L-board{background:var(--bgc);border:1px solid rgba(255,255,255,.14);border-radius:.8em;padding:.6em .9em .5em;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.L-board h1{font-size:.72em;margin:0 0 .45em;padding-bottom:.4em;letter-spacing:.16em;border-bottom:2px solid;border-image:linear-gradient(90deg,var(--a),var(--b)) 1;filter:none}
.L-board .list{gap:0 1.6em}
.L-board .card{display:grid;grid-template-columns:4.2em minmax(0,1fr);align-items:center;gap:.6em;background:none;border:0;border-bottom:1px solid rgba(255,255,255,.1);border-radius:0;box-shadow:none;padding:.32em 0;animation:none}
.L-board .list .card:last-child{border-bottom:0}
.L-board .amt{background:none;box-shadow:none;padding:0;min-width:0;text-align:left;font:800 .95em var(--f2),sans-serif;color:var(--c);text-shadow:none}
.L-board .txt{font-weight:700;line-height:1.18;text-shadow:0 1px 2px rgba(0,0,0,.7)}
.L-board .one .card{padding:.15em 0}
.L-board .card.act{background:linear-gradient(90deg,rgba(255,255,255,.14),transparent);animation:none}
details.more{margin-top:10px}details.more summary{cursor:pointer;color:#c9b6ff;font-weight:800;margin-bottom:8px}
.L-cards .amt,.L-compact .amt{min-width:4.4em;text-align:center}
.card.act .txt{color:var(--c);text-shadow:var(--sh),0 0 10px var(--c)}
.L-flat .card,.L-menu .card,.L-pills .card,.L-outline .card{background:none;border:0;box-shadow:none;border-radius:0;padding:.1em 0}
.L-flat .amt,.L-menu .amt,.L-outline .amt{background:none;box-shadow:none;padding:0;color:var(--b);text-shadow:var(--sh),0 0 10px var(--a)}
.L-menu .card{flex-direction:row-reverse;justify-content:space-between;border-bottom:1px dashed rgba(255,255,255,.3);padding:.15em 0}
.L-outline .txt,.L-outline .amt{color:#fff;-webkit-text-stroke:.14em #000;paint-order:stroke fill;text-shadow:none}
.L-outline .amt{color:var(--c)}
.L-compact .card{padding:.12em .45em;gap:.45em;border-left-width:3px;border-radius:.4em;box-shadow:none}
.L-compact .amt{font-size:.72em;padding:.15em .45em;box-shadow:none}
.L-compact .txt{font-size:.85em}
.w.L-ticker{padding:6px}
.tkw{display:flex;align-items:center;gap:.7em;background:var(--bgc);border:1px solid rgba(255,255,255,.14);border-radius:.7em;padding:.35em .8em;overflow:hidden}
.tkw .tl{font:800 .9em var(--f1),sans-serif;white-space:nowrap;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.tk{flex:1;overflow:hidden;white-space:nowrap}
.track{display:inline-flex;animation:tick var(--d,30s) linear infinite}
.grp{display:inline-flex;gap:1.6em;padding-right:1.6em}
.ti{display:inline-flex;gap:.5em;align-items:center}
.ti.act .txt{color:var(--c)}
@keyframes tick{to{transform:translateX(-50%)}}
.prev .card{animation:none!important}
.rot{perspective:700px;overflow:hidden}
.rot .card:not(.act){animation:none}
.pg{animation-duration:.7s;animation-fill-mode:both}
.a-fade{animation-name:aFade}.a-slide{animation-name:aSlide}.a-zoom{animation-name:aZoom}.a-flip{animation-name:aFlip}.a-drop{animation-name:aDrop}
.a-type .txt{animation:aType 1.4s steps(30) both}
.one .txt{font-size:1.35em}.one .amt{font-size:1.1em}.one .card{padding:.6em .8em}
.meta{display:flex;align-items:center;gap:.6em;margin-top:.35em}
.bar{flex:1;height:.2em;background:rgba(255,255,255,.18);border-radius:1em;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b))}
.dots{font:800 .5em var(--f2),sans-serif;color:#fff;opacity:.95;text-shadow:var(--sh);white-space:nowrap}
.w .tkw{margin-top:.4em}
@keyframes fill{from{width:0}to{width:100%}}
@keyframes aFade{from{opacity:0}}
@keyframes aSlide{from{opacity:0;transform:translateX(70px)}}
@keyframes aZoom{from{opacity:0;transform:scale(.55)}}
@keyframes aFlip{from{opacity:0;transform:rotateX(90deg)}}
@keyframes aDrop{from{opacity:0;transform:translateY(-50px)}}
@keyframes aType{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes in{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
@keyframes glow{50%{box-shadow:0 0 26px var(--c)}}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}8%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}12%{transform:translate(-50%,-50%) scale(1)}90%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
body.widget{background:transparent;overflow:hidden}
/* ===== редактор ===== */
.ed{display:grid;grid-template-columns:minmax(320px,1fr) minmax(280px,420px);gap:18px;padding:18px;max-width:1100px;margin:auto}
@media(max-width:800px){.ed{grid-template-columns:1fr}}
.panel{background:#1a1428;border:1px solid #2e2548;border-radius:14px;padding:14px;margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:15px;color:#c9b6ff}
.row{display:flex;gap:8px;margin-bottom:8px;align-items:center}
input,button,select{font:inherit;color:#fff;background:#261d3d;border:1px solid #3b2f5e;border-radius:8px;padding:8px 10px}
input[type=color]{padding:0;width:42px;height:36px}
input.amt-i{width:90px}input.txt-i{flex:1;min-width:0}
select{flex:1;min-width:0}button{cursor:pointer}button.on{outline:2px solid var(--b)}button:hover{background:#34285a}
button.pri{background:linear-gradient(135deg,var(--a),var(--b));border:0;font-weight:800}
.small{font-size:12px;color:#8f84ad;margin:6px 0 0}
.prev{background:repeating-conic-gradient(#1b1b24 0 25%,#14141b 0 50%) 0 0/20px 20px;border-radius:12px;height:380px;position:relative;overflow:hidden}
.prev .pop{position:absolute;top:50%}
code{background:#261d3d;padding:2px 6px;border-radius:6px;word-break:break-all}
/* ===== полировка ===== */
body{font-family:Onest,Manrope,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.w h1{font-weight:800;letter-spacing:.07em}
.w h2{font-weight:700;letter-spacing:.2em}
.card{background:linear-gradient(180deg,rgba(255,255,255,.06),transparent 60%),var(--bgc);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-left:4px solid var(--b);border-radius:.8em;box-shadow:0 6px 20px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.08)}
.amt{font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:.01em;border-radius:.6em;box-shadow:0 0 12px var(--a),inset 0 1px 0 rgba(255,255,255,.35)}
.txt{font-weight:600;letter-spacing:.004em;line-height:1.22}
.one .txt{font-weight:700}
.w.L-board{background:linear-gradient(180deg,rgba(255,255,255,.05),transparent 50%),var(--bgc);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(255,255,255,.14);border-radius:1em;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.1)}
.L-board .card{grid-template-columns:5em minmax(0,1fr);gap:.7em;border-bottom-color:rgba(255,255,255,.08)}
.L-board .amt{justify-self:stretch;text-align:center;padding:.14em .3em;border-radius:.55em;background:var(--cf,rgba(255,255,255,.08));border:1px solid var(--cl,rgba(255,255,255,.2));color:var(--c);font:800 .9em var(--f2),sans-serif;font-variant-numeric:tabular-nums;text-shadow:none;box-shadow:none}
.L-board .one .amt{font-size:1.05em}
.L-board .txt{font-weight:600}
.L-board .one .txt{font-weight:700}
.L-board .card.act{background:linear-gradient(90deg,var(--cf),transparent)}
.tkw{-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:.8em}
.bar{height:.22em;background:rgba(255,255,255,.14)}
.bar i{box-shadow:0 0 8px var(--a)}
.dots{font-weight:700;opacity:.8}
.pop{-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 0 60px rgba(0,0,0,.55),0 0 36px var(--a)}
/* редактор */
body:not(.widget){background:radial-gradient(1200px 600px at 10% -10%,rgba(155,92,255,.2),transparent 60%),radial-gradient(900px 500px at 100% 0,rgba(255,88,214,.1),transparent 55%),#0d0a16;min-height:100vh}
.panel{background:linear-gradient(180deg,#1d1631,#171124);border:1px solid #2f2650;border-radius:16px;padding:16px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.panel h3{font:700 13px Unbounded,sans-serif;letter-spacing:.05em;color:#d4c6ff;margin:0 0 12px}
input,button,select{border-radius:10px;border:1px solid #3a2f60;background:#241b3a;transition:background .15s,box-shadow .15s,border-color .15s}
input:focus,select:focus{outline:0;border-color:var(--a);box-shadow:0 0 0 3px rgba(155,92,255,.3)}
button:hover{background:#33275a}
button.on{outline:0;border-color:var(--b);background:#3a2a66;box-shadow:0 0 0 2px rgba(255,88,214,.35)}
button.pri{border:0;box-shadow:0 4px 16px rgba(155,92,255,.35)}
button.pri:hover{filter:brightness(1.1)}
.small{color:#9a90b8;line-height:1.45}
code{background:#241b3a;border:1px solid #3a2f60}
.pg{animation-duration:var(--ad,.7s)}
